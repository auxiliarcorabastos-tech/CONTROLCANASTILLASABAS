<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Movimientos y Canastillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f0f4f8; }
        /* Encabezado */
        header { 
            background: linear-gradient(135deg, #1e40af, #3b82f6); 
            color: white; 
            padding: 0.9rem 1.2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            z-index: 100; 
            box-shadow: 0 2px 8px rgba(0,0,0,.15); 
        }
        header h1 { font-size: 1.1rem; font-weight: 600; }
        .btn-menu { 
            background: rgba(255,255,255,.2); 
            border: none; 
            color: white; 
            font-size: 1.4rem; 
            padding: 0.4rem 0.7rem; 
            border-radius: 0.4rem; 
            cursor: pointer; 
            transition: background .2s; 
        }
        .btn-menu:hover { background: rgba(255,255,255,.35); }
        .usuario-info { 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            gap: 0.6rem; 
            flex-wrap: wrap;
        }
        .btn-cerrar { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 0.4rem 0.7rem; 
            border-radius: 0.4rem; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .btn-sm { 
            padding: 0.4rem 0.7rem; 
            font-size: 0.85rem; 
            border: none; 
            border-radius: 0.4rem; 
            cursor: pointer; 
            font-weight: 500; 
            transition: background .2s;
        }
        .btn-actualizar { 
            background: #16a34a; 
            color: white; 
        }
        .btn-actualizar:hover { background: #15803d; }
        /* MENÚ LATERAL — CORREGIDO */
        #sidebar { 
            position: fixed; 
            top: 60px; 
            left: 0; 
            bottom: 0; 
            width: 260px; 
            background: white; 
            box-shadow: 2px 0 10px rgba(0,0,0,.15); 
            z-index: 95; 
            overflow-y: auto; 
            transition: transform .3s ease-in-out; 
            padding-top: 0.5rem; 
        }
        #sidebar.oculto { transform: translateX(-100%); }
        #sidebar.mostrado { transform: translateX(0); }
        .btn-pestaña { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 0.9rem 1.2rem; 
            border: none; 
            background: transparent; 
            cursor: pointer; 
            font-size: 0.95rem; 
            color: #374151; 
            border-left: 4px solid transparent; 
            transition: all .2s; 
        }
        .btn-pestaña:hover { background: #eff6ff; color: #1d4ed8; }
        .btn-pestaña.activa { background: #dbeafe; color: #1d4ed8; border-left-color: #2563eb; font-weight: 600; }
        /* CONTENIDO PRINCIPAL */
        #contenido { 
            margin-left: 0; 
            margin-top: 60px; 
            padding: 1.2rem; 
            transition: margin-left .3s ease; 
            min-height: calc(100vh - 60px); 
        }
        #contenido.con-sidebar { margin-left: 260px; }
        /* Tarjetas y botones */
        .tarjeta { background: white; border-radius: 0.7rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 1.2rem; margin-bottom: 1.2rem; }
        .oculto { display: none !important; }
        .btn { border: none; padding: 0.6rem 1.1rem; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: background .2s; font-size: 0.95rem; }
        .btn-primario { background: #2563eb; color: white; }
        .btn-primario:hover { background: #1d4ed8; }
        .btn-exito { background: #16a34a; color: white; }
        .btn-exito:hover { background: #15803d; }
        .btn-peligro { background: #dc2626; color: white; }
        .btn-peligro:hover { background: #b91c1c; }
        .btn-amarillo { background: #f59e0b; color: #1f2937; }
        .btn-amarillo:hover { background: #d97706; }
        .btn-subpestaña { background: #e5e7eb; padding: 0.5rem 1rem; border-radius: 0.4rem; cursor: pointer; margin-right: 0.5rem; margin-bottom: 0.5rem; border: none; }
        .btn-subpestaña.activa { background: #2563eb; color: white; }
        /* Formularios */
        .grupo { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.35rem; font-weight: 500; color: #374151; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #d1d5db; border-radius: 0.4rem; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem 1.2rem; }
        .flex { display: flex; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.8rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.8rem; }
        .mb-4 { margin-bottom: 1.2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.8rem; }
        .mt-4 { margin-top: 1.2rem; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .text-sm { font-size: 0.85rem; }
        .col-span-2 { grid-column: span 2; }
        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
        th { background: #f3f4f6; font-weight: 600; }
        tr:hover { background: #f9fafb; }
        /* Página de Login */
        #pantallaLogin { 
            position: fixed; 
            inset: 0; 
            background: linear-gradient(135deg, #1e40af, #3b82f6); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 200; 
        }
        .caja-login { 
            background: white; 
            padding: 2rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,.2); 
            width: 90%; 
            max-width: 400px; 
        }
        .caja-login h2 { text-align: center; margin-bottom: 1.5rem; color: #1f2937; }
        #mensajeError { color: #dc2626; margin-top: 0.8rem; text-align: center; font-size: 0.9rem; min-height: 1.2rem; }
        /* RESPONSIVE */
        @media (max-width: 768px) {
            #contenido { margin-left: 0; padding: 0.8rem; padding-top: 10px; }
            .grid-2 { grid-template-columns: 1fr; }
            header h1 { font-size: 0.9rem; }
            .usuario-info { gap: 0.3rem; font-size: 0.8rem; }
            th, td { padding: 0.4rem 0.35rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div id="pantallaLogin">
        <div class="caja-login">
            <h2>🔐 Iniciar Sesión</h2>
            <div class="grupo">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Escriba su usuario">
            </div>
            <div class="grupo">
                <label>Contraseña</label>
                <input type="password" id="clave" placeholder="Escriba su contraseña">
            </div>
            <button class="btn-primario" style="width:100%; margin-top:0.5rem;" onclick="iniciarSesion()">Ingresar</button>
            <div id="mensajeError"></div>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL -->
    <header id="encabezadoApp" class="oculto">
        <button class="btn-menu" id="btnMenu">☰</button>
        <h1>📦 Control de Movimientos</h1>
        <div class="usuario-info">
            <button class="btn-sm btn-actualizar" onclick="refrescarTodo()">🔄 Actualizar</button>
            <span id="nombreUsuario"></span>
            <button class="btn-cerrar" onclick="cerrarSesion()">Salir</button>
        </div>
    </header>

    <!-- MENÚ LATERAL -->
    <div id="sidebar" class="oculto">
        <button class="btn-pestaña activa" onclick="cambiarPestaña('movimientos')">📦 Movimientos</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('transportadora')">🚛 Transportadora</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('combustible')">⛽ Combustible</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('mantenimiento')">🔧 Mantenimiento</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('informes')">📊 Informes</button>
        <button id="btnAdmin" class="btn-pestaña oculto" onclick="cambiarPestaña('administracion')">⚙️ Administración</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="contenido" class="oculto"></div>

    <!-- ORDEN DE CARGA — NO CAMBIAR -->
    <script src="firebase.js"></script>
    <script src="funciones.js"></script>
    <script src="movimientos.js"></script>
    <script src="transportadora.js"></script>
    <script src="combustible.js"></script>
    <script src="mantenimiento.js"></script>
    <script src="informes.js"></script>
    <script src="admin.js"></script>

    <!-- CONTROL DEL MENÚ LATERAL -->
    <script>
        const btnMenu = document.getElementById('btnMenu');
        const sidebar = document.getElementById('sidebar');
        const contenido = document.getElementById('contenido');

        function actualizarMenu() {
            if (!sidebar || !contenido || typeof menuAbierto === 'undefined') return;
            
            if (menuAbierto) {
                sidebar.classList.remove('oculto');
                sidebar.classList.add('mostrado');
                if (window.innerWidth > 768) {
                    contenido.classList.add('con-sidebar');
                } else {
                    contenido.classList.remove('con-sidebar');
                }
            } else {
                sidebar.classList.remove('mostrado');
                sidebar.classList.add('oculto');
                contenido.classList.remove('con-sidebar');
            }
        }

        if (btnMenu) {
            btnMenu.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                menuAbierto = !menuAbierto;
                actualizarMenu();
            });
        }

        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 && menuAbierto) {
                if (!sidebar.contains(e.target) && e.target !== btnMenu) {
                    menuAbierto = false;
                    actualizarMenu();
                }
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                if (!menuAbierto) {
                    menuAbierto = true;
                    actualizarMenu();
                }
            } else {
                if (menuAbierto) {
                    menuAbierto = false;
                    actualizarMenu();
                }
            }
        });

        window.actualizarMenu = actualizarMenu;
    </script>
</body>
</html>
