<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Movimientos y Canastillas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primario: #165DFF;
            --exito: #00B42A;
            --advertencia: #FF7D00;
            --peligro: #F53F3F;
            --gris: #86909C;
            --fondo: #F2F3F5;
            --celeste-claro: #E8F3FF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--fondo); min-height: 100vh; }
        
        /* Encabezado */
        .encabezado {
            background: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 90;
        }
        .btn-menu { 
            background: none; border: none; font-size: 22px; cursor: pointer; 
            padding: 4px 10px; border-radius: 6px;
        }
        .btn-menu:hover { background: var(--fondo); }
        .encabezado h1 { font-size: 16px; font-weight: 700; color: #1D2129; flex: 1; }
        .encabezado small { color: var(--gris); font-size: 12px; }
        .btn-actualizar { background: var(--primario); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-actualizar:hover { opacity: .9; }

        /* =====================================================
           ✅ MENÚ FIJO EN ESCRITORIO / DESPLEGABLE EN MÓVIL
           ===================================================== */
        #sidebar {
            position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: white;
            box-shadow: 2px 0 8px rgba(0,0,0,.15); z-index: 100; 
            transition: transform .25s ease; overflow-y: auto; padding-top: 60px;
        }

        /* ✅ ESCRITORIO: Menú SIEMPRE visible */
        @media (min-width: 769px) {
            #sidebar { transform: translateX(0); }
            .overlay { display: none !important; }
            body { padding-left: 260px; }
            .btn-menu { display: none; }
        }

        /* ✅ MÓVIL: Menú oculto */
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.abierto { transform: translateX(0); }
            .overlay {
                position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 99; display: none;
            }
            .overlay.activo { display: block; }
            body { padding-left: 0; }
            .btn-menu { display: block; }
        }
        
        .btn-pestaña {
            width: 100%; text-align: left; padding: 14px 20px; border: none; background: transparent;
            font-size: 15px; cursor: pointer; border-left: 3px solid transparent; 
            color: #4E5969; transition: all .2s ease;
        }
        .btn-pestaña:hover { 
            background: var(--celeste-claro); color: var(--primario); 
        }
        .btn-pestaña.activa { 
            background: var(--celeste-claro) !important; 
            border-left-color: var(--primario) !important; 
            color: var(--primario) !important; 
            font-weight: 700 !important;
        }
        .btn-pestaña.oculto { display: none !important; }
        
        /* Contenido */
        #contenido { padding: 16px; max-width: 1200px; margin: 0 auto; }
        .oculto { display: none !important; }
        
        /* Tarjetas y formularios */
        .tarjeta { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #1D2129; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #C9CDD4; border-radius: 6px;
            font-size: 14px; transition: border .2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 2px rgba(22,93,255,.15); }
        button { cursor: pointer; border-radius: 6px; font-weight: 600; transition: all .2s; }
        .btn-primario { background: var(--primario); color: white; border: none; padding: 10px 18px; }
        .btn-primario:hover { opacity: .9; }
        
        /* Login */
        .caja-login {
            max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }
        .caja-login h2 { text-align: center; margin-bottom: 24px; color: #1D2129; }
        #mensajeError { color: var(--peligro); text-align: center; margin-top: 12px; font-size: 13px; min-height: 20px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            #contenido { padding: 10px; }
            .tarjeta { padding: 14px; }
        }
    </style>
</head>
<body>

<!-- ===================================================== -->
<!-- 🔐 PANTALLA DE INICIO DE SESIÓN -->
<!-- ===================================================== -->
<div id="pantallaLogin">
    <div class="caja-login">
        <h2>🔐 Iniciar Sesión</h2>
        <div class="form-group">
            <label>Usuario / Correo</label>
            <input type="text" id="usuario" placeholder="Su usuario">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="clave" placeholder="Su contraseña" onkeydown="if(event.key==='Enter')iniciarSesion()">
        </div>
        <button class="btn-primario" style="width:100%" onclick="iniciarSesion()">Ingresar</button>
        <p id="mensajeError"></p>
    </div>
</div>

<!-- ===================================================== -->
<!-- ✅ APLICACIÓN -->
<!-- ===================================================== -->
<div id="appCompleta" class="oculto">

    <!-- Encabezado -->
    <header class="encabezado">
        <button class="btn-menu" onclick="toggleMenu()">☰</button>
        <div style="flex:1">
            <h1>📦 Control de Canastillas</h1>
            <small id="nombreModulo"></small>
        </div>
        <button class="btn-actualizar" onclick="refrescarTodo()">🔄 Actualizar</button>
        <small id="nombreUsuario" style="margin-left:8px;"></small>
    </header>

    <!-- Sombra para cerrar menú (solo en móvil) -->
    <div class="overlay" id="sombraMenu" onclick="toggleMenu()"></div>

    <!-- Menú Lateral — TODOS LOS MÓDULOS INCLUIDOS ✅ -->
    <div id="sidebar">
        <button class="btn-pestaña activa" onclick="cambiarPestaña('movimientos')">📦 Movimientos</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('misCanastillas')">🧺 Mis Canastillas</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('recoleccion')">🚚 Recolección</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('transportadora')">🚛 Transportadora</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('combustible')">⛽ Combustible</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('mantenimiento')">🔧 Mantenimiento</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('informes')">📊 Informes</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('anuncios')">📢 Anuncios</button>
        <button class="btn-pestaña" onclick="cambiarPestaña('donantes')">🤝 Donantes</button>
        <button id="btnAdmin" class="btn-pestaña oculto" onclick="cambiarPestaña('usuarios')">👤 Gestión de Usuarios</button>
        <button id="btnAdmin2" class="btn-pestaña oculto" onclick="cambiarPestaña('admin')">⚙️ Administración</button>
        <div style="border-top:1px solid #eee; margin-top:12px; padding-top:12px;">
            <button class="btn-pestaña" onclick="cerrarSesion()" style="color:var(--peligro)">🚪 Cerrar Sesión</button>
        </div>
    </div>

    <!-- Área de contenido -->
    <main id="contenido"></main>

</div>

<!-- ===================================================== -->
<!-- ✅ TODOS LOS ARCHIVOS EN ORDEN -->
<!-- ===================================================== -->
<script src="firebase.js"></script>
<script src="funciones.js"></script>

<!-- Módulos -->
<script src="movimientos.js"></script>
<script src="misCanastillas.js"></script>
<script src="recoleccion.js"></script>
<script src="transportadora.js"></script>
<script src="combustible.js"></script>
<script src="mantenimiento.js"></script>
<script src="informes.js"></script>
<script src="anuncios.js"></script>
<script src="donantes.js"></script>
<script src="usuarios.js"></script>
<script src="admin.js"></script>

</body>
</html>
